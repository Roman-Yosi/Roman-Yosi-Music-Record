<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login Roman Yosi</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      margin:0;
      padding:0;
      text-align:center;
    }

    header{
      background:#1c1c1c;
      padding:30px;
    }

    h1{
      margin:0;
    }

    .upload-box{

      width:90%;
      max-width:400px;

      margin:40px auto;

      background:#1d1d1d;

      padding:30px;

      border-radius:15px;

      box-shadow:0 0 10px rgba(0,0,0,0.5);

    }

    input{

      width:100%;

      padding:12px;

      margin-top:15px;

      border:none;

      border-radius:8px;

      box-sizing:border-box;

      font-size:16px;

    }

    button{

      width:100%;

      padding:12px;

      margin-top:15px;

      border:none;

      border-radius:8px;

      background:#00aaff;

      color:white;

      font-size:16px;

      cursor:pointer;

    }

    button:hover{
      background:#008ecc;
    }

    #status{

      margin-top:20px;

      font-size:15px;

      word-break:break-word;

    }

    .home{

      display:inline-block;

      margin-top:20px;

      color:#00aaff;

      text-decoration:none;

    }

  </style>

</head>

<body>

<header>

  <h1>Login Account</h1>

  <p>Roman Yosi Music Official</p>

</header>

<section class="upload-box">

  <input
    type="email"
    id="email"
    placeholder="Masukkan Email">

  <input
    type="password"
    id="password"
    placeholder="Masukkan Password">

  <button id="registerBtn">
    Register
  </button>

  <button id="loginBtn">
    Login
  </button>

  <button id="logoutBtn">
    Logout
  </button>

  <p id="status"></p>

  <a href="index.html" class="home">
    ← Kembali ke Home
  </a>

</section>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getAuth,

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey:
  "AIzaSyASJUy17H37jS_sgAJA49otBh6LDJ3QAII",

  authDomain:
  "roman-yosi-music-record.firebaseapp.com",

  projectId:
  "roman-yosi-music-record",

  storageBucket:
  "roman-yosi-music-record.firebasestorage.app",

  messagingSenderId:
  "422122061031",

  appId:
  "1:422122061031:web:7f34069922208516043642",

  measurementId:
  "G-Y8KMVOWCJ8"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const status =
document.getElementById("status");

function showMessage(message,color){

  status.innerText = message;

  status.style.color = color;

}

document
.getElementById("registerBtn")

.addEventListener("click",()=>{

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  if(password.length < 6){

    showMessage(
      "Password minimal 6 karakter",
      "orange"
    );

    return;

  }

  createUserWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(()=>{

    showMessage(
      "✅ Register berhasil",
      "#00ff99"
    );

  })

  .catch((error)=>{

    showMessage(
      "❌ " + error.message,
      "red"
    );

  });

});

document
.getElementById("loginBtn")

.addEventListener("click",()=>{

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  signInWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(()=>{

    showMessage(
      "✅ Login berhasil",
      "#00ff99"
    );

  })

  .catch((error)=>{

    showMessage(
      "❌ " + error.message,
      "red"
    );

  });

});

document
.getElementById("logoutBtn")

.addEventListener("click",()=>{

  signOut(auth)

  .then(()=>{

    showMessage(
      "✅ Logout berhasil",
      "#00ff99"
    );

  })

  .catch((error)=>{

    showMessage(
      "❌ " + error.message,
      "red"
    );

  });

});

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Yosi Login</title>

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:40px;
    }

    .box{
      max-width:400px;
      margin:auto;
      background:#1d1d1d;
      padding:30px;
      border-radius:15px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#00aaff;
      color:white;
      cursor:pointer;
    }

    #status{
      margin-top:20px;
      color:#00ff99;
    }

  </style>

</head>

<body>

<div class="box">

<h1>Login Account</h1>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="registerBtn">Register</button>

<button id="loginBtn">Login</button>

<button id="logoutBtn">Logout</button>

<p id="status"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyASJUy17H37jS_sgAJA49otBh6LDJ3QAII",

  authDomain:
  "roman-yosi-music-record.firebaseapp.com",

  projectId:
  "roman-yosi-music-record",

  storageBucket:
  "roman-yosi-music-record.firebasestorage.app",

  messagingSenderId:
  "422122061031",

  appId:
  "1:422122061031:web:7f34069922208516043642"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const status =
document.getElementById("status");

document.getElementById("registerBtn")
.addEventListener("click", ()=>{

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  createUserWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(()=>{

    status.innerText =
    "✅ Register berhasil";

  })

  .catch((error)=>{

    status.innerText =
    error.message;

  });

});

document.getElementById("loginBtn")
.addEventListener("click", ()=>{

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  signInWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(()=>{

    status.innerText =
    "✅ Login berhasil";

  })

  .catch((error)=>{

    status.innerText =
    error.message;

  });

});

document.getElementById("logoutBtn")
.addEventListener("click", ()=>{

  signOut(auth)

  .then(()=>{

    status.innerText =
    "✅ Logout berhasil";

  })

  .catch((error)=>{

    status.innerText =
    error.message;

  });

});

</script>

</body>
</html>

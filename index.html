<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig = {
  apiKey: "ISI_ULANG_DARI_FIREBASE_CONSOLE",
  authDomain: "roman-yosi-music-record.firebaseapp.com",
  projectId: "roman-yosi-music-record",
  storageBucket: "roman-yosi-music-record.appspot.com",
  messagingSenderId: "422122061031",
  appId: "1:422122061031:web:7f34069922208516e43642"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// REGISTER
window.register = function () {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      document.getElementById('status').innerText = 'Register berhasil';
    })
    .catch((error) => {
      document.getElementById('status').innerText = error.message;
    });
};

// LOGIN
window.login = function () {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      document.getElementById('status').innerText = 'Login berhasil';
    })
    .catch((error) => {
      document.getElementById('status').innerText = error.message;
    });
};

// LOGOUT
window.logout = function () {
  signOut(auth)
    .then(() => {
      document.getElementById('status').innerText = 'Logout berhasil';
    });
};

// CHECK LOGIN STATUS
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('status').innerText =
      "Login sebagai: " + user.email;
  }
});

</script>
